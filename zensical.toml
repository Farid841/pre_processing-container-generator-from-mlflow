[project]
site_name = "MLflow Preprocessing Runner"
site_description = "Builds the preprocessing and AI model containers from an MLflow run"
site_url = "https://farid841.github.io/pre_processing-container-generator-from-mlflow/"
repo_url = "https://github.com/Farid841/pre_processing-container-generator-from-mlflow"
repo_name = "pre_processing-container-generator-from-mlflow"
docs_dir = "documentation"
nav = [
  { "Home" = "index.md" },
  { "Write a preprocessing" = "preprocessing.md" },
  { "Build the images" = "build.md" },
  { "Run the containers" = "containers.md" },
  { "Kafka pipeline" = "kafka.md" },
  { "CI/CD and webhook" = "ci-cd.md" },
  { "Build API" = "build-api.md" },
  { "Development" = "dev.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
